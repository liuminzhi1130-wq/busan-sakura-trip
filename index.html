<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuromi Busan V3.1 🌸</title>
    <style>
        /* --- V3.1 THEME: 亮色庫洛米風格 --- */
        :root {
            --bg-color: #f3e6ff; /* 淺薰衣草紫 */
            --card-bg: #ffffff;  /* 卡片白底 */
            --primary-pink: #ea00ff; /* 亮粉紅 */
            --kuromi-purple: #6a00ba; /* 深紫字體 */
            --text-color: #2d0042; 
            --border-color: #dcb0ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            overflow: hidden;
            font-size: 18px; 
        }

        /* 🌸 背景裝飾：改用 CSS 繪製櫻花點點 (保證不破圖) */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(#eecbff 20%, transparent 20%),
                radial-gradient(#eecbff 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            opacity: 0.4;
        }

        /* 😈 右下角庫洛米 (使用 Icon 替代，確保穩定) */
        .kuromi-sticker {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
            z-index: 10;
            pointer-events: none;
            /* 這裡換成一個穩定的紫色小惡魔圖示 */
            background-image: url('https://cdn-icons-png.flaticon.com/512/1000/1000997.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
            filter: drop-shadow(0 4px 6px rgba(106, 0, 186, 0.4));
        }

        /* --- App 容器 --- */
        .app-container {
            max-width: 600px; 
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.7); 
            box-shadow: 0 0 20px rgba(106, 0, 186, 0.15);
            backdrop-filter: blur(5px); /* 磨砂玻璃效果 */
        }

        /* --- Header --- */
        .header {
            padding: 20px 15px;
            text-align: center;
            background: linear-gradient(135deg, #e0c3fc 0%, #cbb4ff 100%);
            border-bottom: 3px solid #fff;
            flex-shrink: 0;
        }
        .header h1 { 
            margin: 0; 
            font-size: 28px; 
            color: #fff; 
            text-shadow: 2px 2px 0px var(--kuromi-purple);
            letter-spacing: 1px;
        }
        .header p { 
            margin: 8px 0 0; 
            font-size: 16px; 
            color: var(--kuromi-purple); 
            font-weight: bold;
        }

        /* --- Tabs --- */
        .tabs {
            display: flex;
            overflow-x: auto;
            padding: 15px 10px;
            background: #ffffff;
            scrollbar-width: none;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: #f8f0ff;
            border: 2px solid var(--border-color);
            color: var(--kuromi-purple);
            padding: 10px 20px; 
            margin: 0 6px;
            border-radius: 25px;
            white-space: nowrap;
            font-size: 16px; 
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--kuromi-purple);
            color: #fff;
            border-color: var(--kuromi-purple);
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(106, 0, 186, 0.3);
        }

        /* --- 列表區域 --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .day-list { display: none; animation: fadeIn 0.4s; padding-bottom: 100px; }
        .day-list.active { display: block; }

        /* --- 行程卡片 --- */
        .trip-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            margin-bottom: 16px;
            padding: 18px; 
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 0 rgba(220, 176, 255, 0.5); 
            cursor: pointer;
            transition: 0.2s;
        }
        .trip-card:active { transform: translateY(4px); box-shadow: none; }

        .card-time {
            font-size: 18px; 
            font-weight: 800;
            color: var(--primary-pink);
            width: 60px;
            flex-shrink: 0;
            text-align: center;
        }
        .card-info { flex: 1; padding-left: 15px; border-left: 2px dashed #eee; }
        .card-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #333; }
        .card-sub { font-size: 15px; color: #666; }
        .card-arrow { color: var(--border-color); font-size: 24px; font-weight: bold; }

        /* --- 檢查清單樣式 --- */
        .check-item {
            display: flex;
            align-items: center;
            background: #fff;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }
        .check-box {
            width: 28px; height: 28px;
            border: 2px solid var(--kuromi-purple);
            border-radius: 6px;
            margin-right: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .check-item.checked .check-box {
            background: var(--kuromi-purple);
        }
        .check-item.checked .check-box::after {
            content: '😈'; 
            color: white; font-size: 18px;
        }
        .check-item.checked .check-text {
            text-decoration: line-through;
            color: #aaa;
        }
        .check-text { font-size: 19px; font-weight: bold; color: #444; }

        /* --- 彈窗 (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 0, 66, 0.6); z-index: 999;
            display: none; justify-content: center; align-items: flex-end;
        }
        .modal-overlay.open { display: flex; animation: slideUp 0.3s forwards; }

            background: #fff; width: 100%; max-width: 600px;
            height: 85vh;
